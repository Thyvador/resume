- title: IATA ONE Record Hackathon – Hosted by Lufthansa Cargo
  date: June 2023
  context: Participated in an IATA hackathon, sponsored by Lufthansa Cargo, focused on leveraging aviation APIs and the One Record standard to innovate the logistics supply chain. Contributed to a six-member team to develop a comprehensive multimodal transport planning and tracking application.
  responsibilities:
    - Led the development of the user-facing front-end application using React.
  result:
    - Successfully demonstrated a sophisticated transport planning and analysis system designed for multiple stakeholders across various transportation modes.
  technologies:
    - React
    - Material UI
    - MapBox

- title: Multimodal Hackathon Amsterdam – Organized by IATA
  date: May 2022
  context: In a hackathon hosted by IATA and the DSCA, our seven-member team explored the integration of Maritime APIs with the One Record standard to enhance logistics. We designed and developed a marketplace to connect transport services with providers of empty container capacity.
  responsibilities:
    - Engineered the front-end marketplace platform using React, focusing on an intuitive user experience.
  result:
    - Presented a functional prototype with simulated data, showcasing a significant reduction in costs and environmental impact by optimizing empty container transport.
    - Winner of the DSCA challenge.
  technologies:
    - React
    - Material UI
    - MapBox

- title: Twitch Channel Points Hackathon
  date: March 2021
  context: Participated in a Twitch-hosted hackathon to pioneer applications for its new Channel Points API. As part of a four-person team, we developed a solution to deepen viewer-streamer interaction within games and other tools.
  responsibilities:
    - Engineered the backend server infrastructure using Node.js and Express.js.
    - Constructed the interactive front-end application with React.
    - Developed a custom Minecraft plugin in Java to facilitate in-game interactions.
  result:
    - Delivered a multi-faceted application enabling viewers to dynamically modify a streamer's voice via MIDI signals and directly influence the Minecraft server environment using Channel Points.
  technologies:
    - Node.js
    - Express.js
    - React
    - Material UI
    - Java

- title: Traefik Hackathon
  date: October 2020
  context: In a hackathon hosted by Traefik to showcase its plugin system, our two-person team developed an innovative plugin to scale idle Docker services to zero and automatically restart them on-demand.
  responsibilities:
    - Authored a custom Traefik plugin using Go.
    - Developed a complementary microservice with Node.js to manage service state.
  result:
    - Successfully delivered an open-source project enabling on-demand container auto-scaling through the Traefik plugin system.
    - Our team, "Containers on Demand," secured third place in the competition.
  technologies:
    - Node.js
    - Go
    - Traefik

- title: IATA ONE Record Hackathon – September 2020
  date: September 2020
  context: Contributed to IATA's annual hackathon, which centered on the One Record standard for simplifying air cargo communication. Our six-member team developed a "Track & Trace" application, using a vaccine shipment case study to highlight the standard's powerful tracking capabilities.
  responsibilities:
    - Led the design and development of the React-based front-end application.
  result:
    - Presented a dynamic application allowing users to monitor deliveries with live event notifications and real-time map tracking.
    - Winner of the "Track & Trace" challenge.
  technologies:
    - React
    - Material UI
