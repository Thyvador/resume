- title: IATA ONE Record Hackathon – Hosted by Lufthansa Cargo
  date: June 2023
  context: IATA, sponsored by Lufthansa Cargo, organized a hackathon to showcase how aviation APIs and One Record can enhance the logistics supply chain. As part of a team of six, I contributed to developing a multimodal transport planning and tracking application.
  responsibilities:
    - Developed the front-end using React.
  result:
    - Demonstrated a comprehensive transport planning and analysis system involving multiple stakeholders and transportation modes.
  technologies:
    - React
    - Material UI
    - MapBox

- title: Multimodal Hackathon Amsterdam – Organized by IATA
  date: May 2022
  context: IATA, in collaboration with DSCA, hosted a hackathon to explore how Maritime APIs and One Record can improve logistics. As part of a team of seven, I helped develop a marketplace connecting transport services needing cargo capacity with providers having empty containers to move.
  responsibilities:
    - Developed the front-end using React.
  result:
    - Presented a working prototype with simulated data demonstrating how optimizing empty container transport can reduce costs and pollution.
    - Winner of the DSCA challenge.
  technologies:
    - React
    - Material UI
    - MapBox

- title: Twitch Channel Points Hackathon
  date: March 2021
  context: Twitch organized a hackathon to introduce its new API, enabling viewer interactions with streamers via channel points. In a team of four, I contributed to building an application allowing users to interact with games and other tools.
  responsibilities:
    - Developed a backend server using Node.js with Express.js.
    - Built the front-end using React.
    - Created a Minecraft plugin in Java.
  result:
    - Developed an application enabling viewers to modify a streamer's voice using MIDI signals and alter the Minecraft server environment via channel points.
  technologies:
    - Node.js
    - Express.js
    - React
    - Material UI
    - Java

- title: Traefik Hackathon
  date: October 2020
  context: Traefik hosted a hackathon to highlight its plugin system. In a two-person team, I worked on developing a plugin that scales down a Docker service when inactive and restarts it upon receiving a new request.
  responsibilities:
    - Developed a Traefik plugin in Go.
    - Built a supporting Node.js service.
  result:
    - Created an open-source project enabling container auto-scaling via the Traefik plugin system.
    - Achieved third place with the team "Containers on Demand."
  technologies:
    - Node.js
    - Go
    - Traefik

- title: IATA ONE Record Hackathon – September 2020
  date: September 2020
  context: IATA’s annual hackathon focused on its One Record standard, aiming to simplify and standardize communication in the air cargo industry. As part of a six-member team, I contributed to developing a "Track & Trace" application to demonstrate One Record’s tracking capabilities using a vaccine shipment as a case study.
  responsibilities:
    - Developed the front-end using React.
  result:
    - Showcased an application that enables users to track deliveries with live event notifications and real-time mapping.
    - Winner of the "Track & Trace" challenge.
  technologies:
    - React
    - Material UI
